<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片分割并上下反转</title>
    <style>
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .slice {
            position: absolute;
            width: 50%;
            height: 25%; /* 分割成4块 */
            background-size: 100% 400%; /* 图片高度为4倍 */
            background-position: center;
            transform: scaleY(1); /* 上下反转 */
        }

        .slice:nth-child(1) {
            /* top: 0%; */
            top: 75%;
            background-image: url('00024.webp');
            background-position: 0% 0%;
        }

        .slice:nth-child(2) {
            top: 50%;
            background-image: url('00024.webp');
            background-position: 0% 33.33%;
        }

        .slice:nth-child(3) {
            top: 25%;
            background-image: url('00024.webp');
            background-position: 0% 66.66%;
        }

        .slice:nth-child(4) {
            top: 0%;
            background-image: url('00024.webp');
            background-position: 0% 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
    </div>
</body>
</html>
