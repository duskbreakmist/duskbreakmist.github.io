<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多个 img 标签分割并反转</title>
    <style>
        .container {
            position: relative;
            width: 100%;
            height: 100vh; /* 容器高度设为图片显示高度 */
            overflow: hidden;
        }

        /* 每个切片占容器高度的 25% */
        .slice {
            position: absolute;
            width: 100%;
            height: 25%;
            overflow: hidden; /* 隐藏超出部分 */
        }

        /* 图片设置：高度拉满，通过 object-position 定位 */
        .slice img {
            width: 100%;
            height: 100%; /* 图片高度为容器高度的 4 倍 */
            object-fit: cover;
            object-position: left; /* 根据需求调整水平位置 */
        }

        /* 按倒序排列切片（上下反转） */
        .slice:nth-child(1) { top: 75%; }    /* 原图第4部分 */
        .slice:nth-child(2) { top: 50%; }   /* 原图第3部分 */
        .slice:nth-child(3) { top: 25%; }   /* 原图第2部分 */
        .slice:nth-child(4) { top: 0%; }   /* 原图第1部分 */

        /* 调整每个 img 的垂直显示位置 */
        .slice:nth-child(4) img { object-position: 0 75%; }
        .slice:nth-child(3) img { object-position: 0 50%; }
        .slice:nth-child(2) img { object-position: 0 25%; }
        .slice:nth-child(1) img { object-position: 0 0%; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 按倒序排列切片 -->
        <div class="slice"><img src="00024.webp" alt="Slice 4"></div>
        <div class="slice"><img src="00024.webp" alt="Slice 3"></div>
        <div class="slice"><img src="00024.webp" alt="Slice 2"></div>
        <div class="slice"><img src="00024.webp" alt="Slice 1"></div>
    </div>
</body>
</html>
